name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==================== CHECKOUT ====================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ==================== STREAK CARD ====================

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: "user=${{ github.repository_owner }}&theme=dark&hide_border=true&disable_animations=true&ring=F59E0B&fire=F59E0B&currStreakLabel=F59E0B&sideNums=FFFFFF&currStreakNum=FFFFFF&sideLabels=FFFFFF&dates=AAAAAA&border=444444"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================== GITHUB STATS CARD ====================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================== TOP LANGUAGES CARD ====================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=tokyonight&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================== COMMIT CARDS ====================

      - name: Commit profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Update GitHub profile cards" || exit 0

          git push